# Tag and release the tool's version, once, when a new one reaches main.
# The version comes from tools/autoflash/__init__.py and the notes from
# CHANGELOG.md (tools/repo/release_notes.py), so a release is: add the notes,
# change the number, merge.
#
# Only once the unit tests, the final firmware on the emulator, the lint and
# the leak scan pass on that commit: on a push, the runs the push started
# rather than the same again; started any other way, it runs them. The
# release carries the firmware files the tool installs and SHA256SUMS; with
# the repository's immutable releases, GitHub signs an attestation of them
# and of the tag (`gh release verify`).
name: Release

on:
  push:
    branches: [main]
  # The firmware-update workflow starts it after merging: a merge by a
  # workflow's own token does not start another workflow.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version in the code, if it is not released yet
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 tools/repo/release_notes.py --version)"
          if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already released"
          else
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  # The lint, leak scan and tests the push started, waited for: their results
  # are the gate. One the push did not start (emulator-check.yml runs only for
  # some paths) is run below instead. A failed one, run again and passed, is
  # taken up by running this job again.
  pushed:
    needs: version
    if: github.event_name == 'push' && needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
    outputs:
      missing: ${{ steps.wait.outputs.missing }}
    steps:
      - name: The runs the push started, once they finish
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=() failed=0
          for workflow in lint.yml leak-scan.yml emulator-check.yml; do
              result="not finished in time" seen='' url=''
              for i in $(seq 250); do   # 20 s apart
                  IFS=$'\t' read -r status url conclusion < <(gh run list -R "$GITHUB_REPOSITORY" \
                      --workflow "$workflow" --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" \
                      --event push --json status,url,conclusion \
                      --jq 'first // empty | [.status, .url, .conclusion] | @tsv') || true
                  [ -z "$status" ] || seen=1
                  if [ -z "$seen" ] && [ "$i" -gt 3 ]; then result=missing; break; fi
                  if [ "$status" = completed ]; then result=$conclusion; break; fi
                  sleep 20
              done
              echo "$workflow: $result $url"
              case $result in
                  success) ;;
                  missing) missing+=("$workflow") ;;   # run below
                  *) echo "::error::$workflow: $result $url"; failed=1 ;;
              esac
          done
          echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
          exit $failed

  tests:
    needs: [version, pushed]
    if: >-
      !cancelled() && needs.version.outputs.tag != ''
      && contains(fromJSON('["success", "skipped"]'), needs.pushed.result)
      && (github.event_name != 'push' || contains(needs.pushed.outputs.missing, 'emulator-check.yml'))
    permissions:
      contents: read
      actions: read   # its emulator job looks for the emulator-image workflow's run
    uses: ./.github/workflows/emulator-check.yml

  lint:
    needs: [version, pushed]
    if: >-
      !cancelled() && needs.version.outputs.tag != ''
      && contains(fromJSON('["success", "skipped"]'), needs.pushed.result)
      && (github.event_name != 'push' || contains(needs.pushed.outputs.missing, 'lint.yml'))
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  leak-scan:
    needs: [version, pushed]
    if: >-
      !cancelled() && needs.version.outputs.tag != ''
      && contains(fromJSON('["success", "skipped"]'), needs.pushed.result)
      && (github.event_name != 'push' || contains(needs.pushed.outputs.missing, 'leak-scan.yml'))
    permissions:
      contents: read
    uses: ./.github/workflows/leak-scan.yml

  release:
    needs: [version, pushed, tests, lint, leak-scan]
    # Each gate passed or, on a push, left to the run the push started.
    if: >-
      !cancelled() && needs.version.outputs.tag != ''
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag and release it, with the firmware it installs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          python3 tools/repo/release_notes.py "${TAG#v}" > notes.md
          # The files SHA256SUMS pins that the tool sends (archive/ is history).
          mapfile -t files < <(awk '$2 ~ /^artifacts\// { print $2 }' SHA256SUMS)
          sha256sum --check --strict SHA256SUMS
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md \
              SHA256SUMS "${files[@]}"
