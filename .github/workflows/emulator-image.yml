# The emulator's image, built once for each version of what it is built from
# (tools/emulator/image.sh tag) and published as
# ghcr.io/<owner>/autoflash-emu:<that hash>: computers and runners pull it
# rather than build QEMU themselves (emu.sh), and only one labelled with the
# hash of their own checkout's emulator.
name: Emulator image

on:
  push:
    paths:
      - tools/emulator/emu.Dockerfile
      - tools/emulator/fork/**
      - tools/emulator/container/**
      - tools/emulator/image.sh
      - .github/workflows/emulator-image.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: emulator-image-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish it, unless it is published already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tools/emulator/image.sh tag)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autoflash-emu:$tag"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "$image is published already"
              exit 0
          fi
          time tools/emulator/image.sh build "$image"
          docker push "$image"
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"
