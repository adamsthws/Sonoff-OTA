# The website at firmwareliberator.com (website/README.md): tested and built
# with Astro, then deployed from main to the Cloudflare Worker
# website/wrangler.jsonc describes. A pull request builds it only, so one
# that breaks the site shows before it is merged.
#
# The deploy job's environment, website, takes only main (set by
# tools/repo/github_settings.py) and holds CLOUDFLARE_API_TOKEN.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  # The dependabot-merge workflow starts it after merging: a merge by a
  # workflow's own token does not start another workflow.
  workflow_dispatch:

permissions: {}

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The packages package-lock.json pins, by hash; none of their install
      # scripts is run.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: website/dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: website
      url: https://firmwareliberator.com/
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: website/dist
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
