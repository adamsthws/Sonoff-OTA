# The S61 emulator's image, built once for each version of what it is built
# from (docs/s61-tools/emulator/bk-emu.sh tag) and published as
# ghcr.io/<owner>/autoflash-beken-emu:<that hash>: computers and runners pull
# it rather than build it themselves (bk-emu.sh), and only one labelled with
# the hash of their own checkout's emulator.
name: Beken emulator image

on:
  push:
    paths:
      - docs/s61-tools/emulator/bk-emu.Dockerfile
      - docs/s61-tools/emulator/bk-emu.sh
      - docs/s61-tools/emulator/UPSTREAM
      - docs/s61-tools/emulator/requirements.txt
      - docs/s61-tools/emulator/patches/**
      - .github/workflows/beken-emulator-image.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: beken-emulator-image-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish it, unless it is published already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(docs/s61-tools/emulator/bk-emu.sh tag)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autoflash-beken-emu:$tag"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "$image is published already"
              exit 0
          fi
          time docs/s61-tools/emulator/bk-emu.sh build "$image"
          docker push "$image"
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"
