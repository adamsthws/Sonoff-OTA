# The website's zone on Cloudflare, as tools/repo/cloudflare_settings.py
# says: set on each push to main that changes it, and checked weekly, when a
# change made in the dashboard fails the run, so it is either written down
# there or put back (started by hand with `apply`).
name: Cloudflare settings

on:
  push:
    branches: [main]
    paths:
      - tools/repo/cloudflare_settings.py
      - .github/workflows/cloudflare-settings.yml
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Set what differs, rather than only say it"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: cloudflare-settings

jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: website
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: What differs, set on a push or when asked
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPLY: ${{ github.event_name == 'push' || inputs.apply }}
        run: |
          if [ "$APPLY" = true ]; then
              python3 tools/repo/cloudflare_settings.py apply
          else
              python3 tools/repo/cloudflare_settings.py
          fi
