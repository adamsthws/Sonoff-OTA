# The web page at firmwareliberator.com: GitHub's own Jekyll builds main,
# rendering the README as the front page and the docs beside it, in the
# layout under _layouts. The tool, its tests, the firmware and the
# archive's code stay off the site; its research and docs are linked to.
title: FirmwareLiberator
description: Sonoff S60 to Tasmota or ESPHome, over the air - flash it, don't smash it.
url: https://firmwareliberator.com
repository: adamsthws/Sonoff-OTA
plugins:
  - jekyll-sitemap
exclude:
  - AGENTS.md
  - CLAUDE.md
  - archive/__init__.py
  - archive/artifacts/
  - archive/bridge/
  - archive/esphome-prototype/
  - archive/repartition/
  - archive/requirements.txt
  - archive/s61-research/
  - archive/tasmota-s60/
  - archive/tests/
  - archive/tools/
  - artifacts/
  - requirements/
  - start.cmd
  - start.sh
  - tests/
  - tools/
