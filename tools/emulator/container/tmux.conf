set -g mouse on
# docker run -t names the outer terminal plain "xterm", which claims 8
# colours: tmux would round every 256-colour shade (the tool's purple link
# titles) to the nearest of those. Terminals that run this have full colour.
set -as terminal-features ",xterm*:256:RGB"
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g status-style "bg=colour24,fg=white"
set -g status-left " S60 emulator "
set -g status-left-length 20
set -g status-right " #(cat /run/s60emu/cloud-label) | plug: #(plug status | head -1 | awk '{print $2}') | wifi: #(cat /run/s60emu/network) "
set -g status-right-length 80
set -g status-interval 3
