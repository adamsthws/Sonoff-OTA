# ESPHome for the Sonoff S60 (UK S60TPG and EU S60TPF: the same pins).
#
# The conversion tool installs this pre-built (artifacts/README.md says how it
# is built), with no Wi-Fi and no passwords in it: it writes the plug's own
# Wi-Fi into the two placeholders below (tools/autoflash/imprint.py), and at
# boot they are handed to wifi.configure. Kept in this one file, so that Home
# Assistant can adopt the plug from it (dashboard_import) and build it there.

esphome:
  # Named as every ESPHome the conversion installs is, whatever the plug:
  # esphome- and the last three bytes of its MAC (esphome-abcdef), its own
  # network too. The friendly name says what plug it is.
  name: esphome
  friendly_name: Sonoff S60
  name_add_mac_suffix: true
  project:
    name: adamsthws.sonoff-s60
    version: "1.3.0"
  # System headers only: adoption takes this one file
  includes:
    - <nvs.h>
    - <soc/usb_serial_jtag_reg.h>
  on_boot:
    # Tasmota holds the relay and LED pins through a software restart, and
    # the install ends with one: release them before anything drives them,
    # or the relay stays as Tasmota left it until the plug is unplugged.
    - priority: 1000
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_4);
            gpio_hold_dis(GPIO_NUM_5);
        # Before Wi-Fi starts (its priority is 250): the network to join, from
        # the image, and its own network's name. Wi-Fi details saved earlier
        # (from Home Assistant, say) take their place as Wi-Fi starts.
        - lambda: |-
            // Written by the conversion tool: each a marker, then filler, and
            // each must appear exactly once in the image. Read through volatile
            // pointers, so the compiler cannot fold in this build-time text.
            static const char ssid[] = "AUTOFLASH-IMPRINT-SSID>.................................";
            static const char password[] = "AUTOFLASH-IMPRINT-PASS>................................................................";
            const char *volatile at_ssid = ssid;
            const char *volatile at_password = password;
            id(imprinted_ssid) = at_ssid;
            id(imprinted_password) = at_password;
            if (!id(imprinted_ssid).empty() && id(imprinted_ssid).rfind("AUTOFLASH-IMPRINT-", 0) != 0) {
              wifi::WiFiAP sta;
              sta.set_ssid(id(imprinted_ssid));
              sta.set_password(id(imprinted_password));
              wifi::global_wifi_component->set_sta(sta);
            }
            // Its own network has its name (esphome-abcdef), open, as
            // Tasmota's has its own.
            wifi::WiFiAP ap;
            ap.set_ssid(App.get_name());
            wifi::global_wifi_component->set_ap(ap);
    # After globals are restored (800), before the meter is read: the plug's
    # factory calibration and board factor, as the stock firmware applies them.
    - priority: 600
      then:
        - lambda: |-
            // Board variant: stock reads GPIO6, GPIO10 and GPIO19 with pull-ups at
            // boot and scales voltage and power by 1.02 unless all are high. Like
            // stock, detach the USB pads first so GPIO19 (USB D+) reads as a GPIO.
            // They stay detached, so the USB log ends here; the API log is unaffected.
            CLEAR_PERI_REG_MASK(USB_SERIAL_JTAG_CONF0_REG, USB_SERIAL_JTAG_USB_PAD_ENABLE);
            const gpio_num_t board_id_pins[] = {GPIO_NUM_6, GPIO_NUM_10, GPIO_NUM_19};
            for (gpio_num_t pin : board_id_pins) {
              gpio_reset_pin(pin);
              gpio_set_direction(pin, GPIO_MODE_INPUT);
              gpio_set_pull_mode(pin, GPIO_PULLUP_ONLY);
            }
            delayMicroseconds(100);
            bool all_high = true;
            for (gpio_num_t pin : board_id_pins) {
              if (gpio_get_level(pin) == 0) all_high = false;
            }
            id(meter_factor) = all_high ? 1.0f : 1.02f;

            // Factory calibration in Sonoff's NVS: namespace user_unusual, blob
            // "content" (JSON), field calib_coefficient0 =
            // "1,1,[9 numbers],[9 numbers]".
            std::string content;
            nvs_handle_t handle;
            if (nvs_open("user_unusual", NVS_READONLY, &handle) == ESP_OK) {
              size_t length = 0;
              if (nvs_get_blob(handle, "content", nullptr, &length) == ESP_OK && length > 0) {
                content.resize(length);
                if (nvs_get_blob(handle, "content", &content[0], &length) != ESP_OK) content.clear();
              }
              nvs_close(handle);
            }
            std::vector<double> numbers;
            const std::string key = "\"calib_coefficient0\":\"";
            size_t start = content.find(key);
            if (start != std::string::npos) {
              start += key.size();
              size_t end = content.find('"', start);
              std::string text = content.substr(start, end == std::string::npos ? std::string::npos : end - start);
              const char *p = text.c_str();
              while (*p != '\0') {
                if (*p == ',' || *p == '[' || *p == ']') {
                  p++;
                  continue;
                }
                char *next;
                double value = strtod(p, &next);
                if (next == p) break;
                numbers.push_back(value);
                p = next;
              }
            }

            // Else the one the conversion tool gave from the plug's Sonoff
            // backup (autoflash_calibration), once Sonoff's NVS has none.
            const char *source;
            if (numbers.size() == 20) {
              std::copy(numbers.begin() + 2, numbers.end(), id(calibration).begin());
              source = "stock NVS";
            } else if (id(calibration_given)) {
              id(calibration) = id(calibration_from_backup);
              source = "from backup";
            } else {
              source = "missing";
            }
            id(calibration_status) = std::string(source) + ", factor " + (all_high ? "1.00" : "1.02");
            ESP_LOGI("s60", "Calibration: %s", id(calibration_status).c_str());
    # Once, after globals are restored: the energy totals of 1.3.0 and before,
    # integration sensors, each saved (Wh, a float) under its sensor's name.
    - priority: 600
      then:
        - lambda: |-
            if (!id(energy_carried_over)) {
              float wh;
              if (id(energy_daily).make_entity_preference<float>().load(&wh)) id(energy_daily_wh) = wh;
              if (id(energy_monthly).make_entity_preference<float>().load(&wh)) id(energy_monthly_wh) = wh;
              if (id(energy_yearly).make_entity_preference<float>().load(&wh)) id(energy_yearly_wh) = wh;
              if (id(energy_total).make_entity_preference<float>().load(&wh)) id(energy_total_wh) = wh;
              id(energy_carried_over) = true;
            }
    # After Wi-Fi is set up: on the image's details (nothing saved before),
    # saved, so they stay. Not wifi.configure, which - when its first try takes
    # over 30 s, a router restarting, say - puts back what was there before
    # (nothing, on a first boot) and saves that.
    - priority: -100
      then:
        - lambda: |-
            if (!id(imprinted_ssid).empty() && id(imprinted_ssid).rfind("AUTOFLASH-IMPRINT-", 0) != 0 &&
                wifi::global_wifi_component->get_sta().get_ssid() == id(imprinted_ssid)) {
              wifi::global_wifi_component->save_wifi_sta(id(imprinted_ssid), id(imprinted_password));
            }
            // Saved, too, where a build of this config with no Wi-Fi written
            // in looks for them - one Home Assistant's ESPHome builder makes,
            // say. ESPHome keys saved details by the whole config and its
            // version when a build has a network at start-up, as this one has
            // with the details written in, and by one fixed key when it has
            // none: without this, that build finds none, and raises its own
            // network. Kept to the network in use, written only when changed.
            const auto &sta = wifi::global_wifi_component->get_sta();
            if (!sta.get_ssid().empty()) {
              auto fixed = global_preferences->make_preference<wifi::SavedWifiSettings>(88491487UL, true);
              wifi::SavedWifiSettings saved{};
              if (!fixed.load(&saved) || sta.get_ssid() != saved.ssid || sta.get_password() != saved.password) {
                wifi::SavedWifiSettings save{};
                strncpy(save.ssid, sta.get_ssid().c_str(), sizeof(save.ssid) - 1);
                strncpy(save.password, sta.get_password().c_str(), sizeof(save.password) - 1);
                fixed.save(&save);
                global_preferences->sync();
              }
            }

# Adopting the plug in Home Assistant's ESPHome builder takes this config.
dashboard_import:
  package_import_url: github://adamsthws/Sonoff-OTA/ESPHome/sonoff_s60.yaml@main
  import_full_config: true

globals:
  - id: imprinted_ssid
    type: std::string
  - id: imprinted_password
    type: std::string
  # Power (W) of the last meter reading, after the board factor and before
  # calibration: stock compares this same value with 300 W to pick the set
  - id: raw_power
    type: float
    initial_value: "0.0"
  - id: meter_factor
    type: float
    initial_value: "1.0"
  # Two sets of [a, b, c] for current, voltage and power: below 300 W, then
  # from 300 W on. Uncalibrated until read at boot from Sonoff's NVS, or
  # from what the conversion tool gave.
  - id: calibration
    type: std::array<double, 18>
    initial_value: "{0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0}"
  - id: calibration_status
    type: std::string
    initial_value: '"unknown"'
  # The factory calibration the conversion tool gave from the plug's Sonoff
  # backup, for a plug whose Sonoff NVS no longer has it.
  - id: calibration_from_backup
    type: std::array<double, 18>
    restore_value: true
    initial_value: "{0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0}"
  - id: calibration_given
    type: bool
    restore_value: true
    initial_value: "false"
  # The energy totals (Wh), counted from the meter's pulses. Doubles: a float
  # would drop a small load's few mWh once a total is large.
  - id: energy_daily_wh
    type: double
    restore_value: true
    initial_value: "0.0"
  - id: energy_monthly_wh
    type: double
    restore_value: true
    initial_value: "0.0"
  - id: energy_yearly_wh
    type: double
    restore_value: true
    initial_value: "0.0"
  - id: energy_total_wh
    type: double
    restore_value: true
    initial_value: "0.0"
  - id: energy_carried_over
    type: bool
    restore_value: true
    initial_value: "false"

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
  flash_size: 4MB

# avoid frequent NVS write to save flash
preferences:
  flash_write_interval: 60s

logger:

api:
  # Not restarting when Home Assistant is away: a plug without it would cut
  # the power to what it runs every 15 minutes (the default).
  reboot_timeout: 0s
  actions:
    # The Wi-Fi the plug is on, name and password, for the conversion tool to
    # hand to the next firmware when the plug leaves ESPHome: ESPHome says
    # neither otherwise. Anything that can use this API can ask - anything on
    # the network, while the API has no encryption key, as Tasmota's settings
    # backup gives them too. Give the API a key to close it; the tool then
    # asks for the details instead.
    - action: autoflash_wifi
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              root["ssid"] = wifi::global_wifi_component->get_sta().get_ssid();
              root["password"] = wifi::global_wifi_component->get_sta().get_password();
    # The plug's factory calibration (the 18 numbers of calib_coefficient0
    # after its two 1s), which the conversion tool gives from the plug's
    # Sonoff backup: saved, and used when Sonoff's NVS has none - on a plug
    # converted through Tasmota. The tool then reads the Calibration sensor.
    # (No answer: ESPHome 2026.10.0 builds no action with a list that answers.)
    - action: autoflash_calibration
      variables:
        coefficients: float[]
      then:
        - lambda: |-
            if (coefficients.size() == 18) {
              std::copy(coefficients.begin(), coefficients.end(), id(calibration_from_backup).begin());
              id(calibration_given) = true;
              if (id(calibration_status).rfind("stock NVS", 0) != 0) {
                id(calibration) = id(calibration_from_backup);
                id(calibration_status) = std::string("from backup, factor ") +
                                         (id(meter_factor) == 1.0f ? "1.00" : "1.02");
              }
            }
        - component.update: calibration_sensor
        # Written to flash now, once the globals have saved themselves (each
        # loop), not up to a minute later: unplugged in that minute, the plug
        # would forget it.
        - delay: 1s
        - lambda: global_preferences->sync();

ota:
  - platform: esphome
    #allow_partition_access: true

web_server:
  version: 3
  # The page's code from the plug itself, so it works where the plug has no internet.
  local: true

wifi:
  reboot_timeout: 0s
  ap: {}

captive_portal:

time:
  - platform: sntp
    id: time_sntp
    #timezone: "CET-1CEST,M3.5.0,M10.5.0/3"
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: id(energy_daily_wh) = 0;
          - component.update: energy_daily
      - seconds: 0
        minutes: 0
        hours: 0
        days_of_month: 1
        then:
          - lambda: id(energy_monthly_wh) = 0;
          - component.update: energy_monthly
      - seconds: 0
        minutes: 0
        hours: 0
        days_of_month: 1
        months: 1
        then:
          - lambda: id(energy_yearly_wh) = 0;
          - component.update: energy_yearly

uart:
  rx_pin: GPIO7
  baud_rate: 4800
  parity: EVEN

status_led:
  pin:
    number: GPIO5
    inverted: false  # Tasmota's 544 on this pin: LedLink, not inverted

switch:
  - id: relay
    platform: gpio
    name: "Relay"
    pin: GPIO4
    restore_mode: RESTORE_DEFAULT_ON  # as it was before a power cut; on if never set

number:
  - platform: template
    name: "Overload threshold"
    id: overload_threshold
    icon: mdi:flash-alert
    unit_of_measurement: "W"
    min_value: 100
    max_value: 4000
    step: 10
    initial_value: 3500
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    name: Countdown
    id: countdown_seconds
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 0
    max_value: 86400
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: false
    mode: box
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - script.execute: countdown_script
            else:
              - script.stop: countdown_script

script:
  - id: countdown_script
    mode: restart
    then:
      - logger.log:
          format: "Toggling in %.0f seconds"
          args: [id(countdown_seconds).state]
      - delay: !lambda "return id(countdown_seconds).state * 1000;"
      - switch.toggle: relay
      - number.set:
          id: countdown_seconds
          value: 0
      - logger.log: "Countdown finished – toggling the relay"

binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
  - platform: template
    name: "Overload"
    id: overload
    device_class: problem
    lambda: |-
      return id(power).state > id(overload_threshold).state;
  - platform: template
    id: overload_delayed
    internal: true
    lambda: |-
      return id(power).state > id(overload_threshold).state;
    filters:
      - delayed_on: 5s
      - delayed_off: 1s
    on_press:
      then:
        - switch.turn_off: relay
        - logger.log:
            level: WARN
            format: "Overload > 5s (%.0f W > %.0f W) – turning off"
            args: [id(power).state, id(overload_threshold).state]

text_sensor:
  # Where the calibration came from (stock NVS, from backup or missing) and
  # the board factor
  - platform: template
    name: "Calibration"
    id: calibration_sensor
    entity_category: diagnostic
    lambda: return id(calibration_status);
    update_interval: 60s

sensor:
  # Calibrated as the stock firmware does: its coefficients work in mA, mV and
  # mW (a*x^2/1e7 + b*x/1e6 + c/1e6), which in A, V and W becomes
  # a*1e-4*x^2 + b/1e6*x + c/1e9. Set 1 applies below 300 W, set 2 above.
  - platform: cse7766
    current:
      name: "Current"
      filters:
        - lambda: |-
            const auto &c = id(calibration);
            int i = id(raw_power) < 300.0f ? 0 : 9;
            return c[i] * 1e-4 * x * x + c[i + 1] / 1e6 * x + c[i + 2] / 1e9;
        - throttle_average: 1s
    voltage:
      name: "Voltage"
      filters:
        - lambda: |-
            const auto &c = id(calibration);
            int i = (id(raw_power) < 300.0f ? 0 : 9) + 3;
            x *= id(meter_factor);
            return c[i] * 1e-4 * x * x + c[i + 1] / 1e6 * x + c[i + 2] / 1e9;
        - throttle_average: 1s
    power:
      name: "Power"
      id: power
      filters:
        - lambda: |-
            const auto &c = id(calibration);
            x *= id(meter_factor);
            id(raw_power) = x;
            int i = (x < 300.0f ? 0 : 9) + 6;
            float y = c[i] * 1e-4 * x * x + c[i + 1] / 1e6 * x + c[i + 2] / 1e9;
            return y < 0.0f ? 0.0f : y;
        - throttle_average: 1s
    # Energy since boot (Wh), from the meter's own pulses, which stay right at
    # loads too small for the power reading. Each increase is calibrated as
    # the power it was drawn at, and added to the totals below.
    energy:
      name: "Energy"
      unit_of_measurement: Wh
      device_class: energy
      state_class: total_increasing
      filters:
        - lambda: |-
            static float last = NAN;
            static double since_boot = 0;
            if (!std::isnan(last) && x > last) {
              const auto &c = id(calibration);
              float p = id(raw_power);
              int i = (p < 300.0f ? 0 : 9) + 6;
              double scale = id(meter_factor);
              if (p > 0.0f) scale *= std::max(0.0, c[i] * 1e-4 * p * p + c[i + 1] / 1e6 * p + c[i + 2] / 1e9) / p;
              double wh = (x - last) * scale;
              since_boot += wh;
              id(energy_daily_wh) += wh;
              id(energy_monthly_wh) += wh;
              id(energy_yearly_wh) += wh;
              id(energy_total_wh) += wh;
            }
            last = x;
            return (float) since_boot;
        - throttle: 5s
    apparent_power:
      name: "Apparent power"
      disabled_by_default: true
      filters:
        - throttle_average: 1s
    reactive_power:
      name: "Reactive power"
      disabled_by_default: true
      filters:
        - throttle_average: 1s
    power_factor:
      name: "Power factor"
      disabled_by_default: true
      filters:
        - throttle_average: 1s

  # The energy totals, kept through restarts and updates. Named as 1.3.0's,
  # so Home Assistant keeps their history.
  - platform: template
    name: "Daily energy"
    id: energy_daily
    lambda: return id(energy_daily_wh) / 1000.0;
    update_interval: 5s
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: "Monthly energy"
    id: energy_monthly
    lambda: return id(energy_monthly_wh) / 1000.0;
    update_interval: 5s
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: "Yearly energy"
    id: energy_yearly
    lambda: return id(energy_yearly_wh) / 1000.0;
    update_interval: 5s
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: "Total energy"
    id: energy_total
    lambda: return id(energy_total_wh) / 1000.0;
    update_interval: 5s
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing

  # The Wi-Fi signal where the plug is, in dBm. The conversion tool reads it
  # (/sensor/WiFi Signal) before it changes the plug's firmware, to suggest
  # moving a plug whose signal is weak; keep its name for that.
  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s
