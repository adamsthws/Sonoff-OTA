esphome:
  name: "s60tpf"
  friendly_name: "Sonoff S60TPF"
  comment: "Sonoff S60TPF (ESP32-C3)"

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
  partitions: "partitions_sonoff_stock.csv"
  flash_size: 4MB

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    password: !secret ota_password
    #allow_partition_access: true

captive_portal:

web_server:
  version: 3
  auth:
    username: !secret web_server_username
    password: !secret web_server_password

uart:
  rx_pin: GPIO7
  baud_rate: 4800
  parity: EVEN

status_led:
  pin:
    number: GPIO5
    inverted: true

switch:
  - id: switch_1
    platform: gpio
    name: "relay"
    pin: GPIO4
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: GPIO9
      inverted: true
    on_press:
      - switch.toggle: switch_1
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

sensor:
  - platform: cse7766
    current:
      name: "Current"
    voltage:
      name: "Voltage"
    power:
      name: "Power"
    energy:
      name: "Energy"
    apparent_power:
      name: "Apparent power"
    reactive_power:
      name: "Reactive power"
    power_factor:
      name: "Power factor"
