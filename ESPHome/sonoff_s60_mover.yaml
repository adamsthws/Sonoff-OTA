# The mover: a small ESPHome the conversion tool runs for a minute or two,
# only to change which memory layout a plug has. Not something to keep on a
# plug, and not for Home Assistant.
#
# Leaving Tasmota, the plug is on Tasmota's layout, and its running Tasmota
# sits across both of the app slots Sonoff's layout has, so nothing it runs
# can write into either. This is small enough to go in front of it, at
# 0x20000, Sonoff's first slot: the tool writes it there, with Sonoff's
# layout last, and the plug starts it. The tool then sends what comes next as
# an ordinary update.
#
# Like sonoff_s60.yaml it is published pre-built with Wi-Fi placeholders the
# tool writes the plug's Wi-Fi into; it saves nothing, as it never stays.

esphome:
  name: sonoff-s60-mover
  name_add_mac_suffix: true
  project:
    name: adamsthws.sonoff-s60-mover
    version: "1.0.0"
  on_boot:
    - priority: 1000
      then:
        - lambda: |-
            // Every setup network of the conversion has one name: Sonoff-Setup-
            // and the last two bytes of the plug's Wi-Fi MAC (Sonoff-Setup-CDEF),
            // open. Set before Wi-Fi starts (its priority is 250).
            uint8_t mac[6];
            get_mac_address_raw(mac);
            char name[20];
            snprintf(name, sizeof(name), "Sonoff-Setup-%02X%02X", mac[4], mac[5]);
            wifi::WiFiAP ap;
            ap.set_ssid(name);
            wifi::global_wifi_component->set_ap(ap);
    - priority: -100
      then:
        - lambda: |-
            static const char ssid[] = "S60-IMPRINT-SSID>.................................";
            static const char password[] = "S60-IMPRINT-PASS>................................................................";
            const char *volatile at_ssid = ssid;
            const char *volatile at_password = password;
            id(imprinted_ssid) = at_ssid;
            id(imprinted_password) = at_password;
        - if:
            condition:
              lambda: |-
                return !id(imprinted_ssid).empty()
                    && id(imprinted_ssid).rfind("S60-IMPRINT-", 0) != 0;
            then:
              - wifi.configure:
                  ssid: !lambda 'return id(imprinted_ssid);'
                  password: !lambda 'return id(imprinted_password);'
                  save: false

globals:
  - id: imprinted_ssid
    type: std::string
  - id: imprinted_password
    type: std::string

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
  flash_size: 4MB

wifi:
  reboot_timeout: 0s
  # Two minutes away from the home network, and it raises its own, where the
  # captive portal's page takes new Wi-Fi details - the home network changed
  # since the plug last joined it, say - while it goes on trying the home one.
  # Without it a mover that cannot join is a plug only a serial cable reaches.
  ap:
    ap_timeout: 2min

captive_portal:

# Not needed - the tool finds the mover by its address and its update service -
# and leaving it out keeps the mover small enough to go in front of Tasmota.
mdns:
  disabled: true

ota:
  - platform: esphome
