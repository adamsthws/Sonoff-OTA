<svg xmlns="http://www.w3.org/2000/svg" width="710" height="1001" viewBox="0 0 710 1001" role="img" aria-labelledby="title">
<title id="title">A successful conversion to Tasmota: all 16 stages complete, then the report to share</title>
<style>text{font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;fill:#ffffff;white-space:pre}.b{font-weight:bold}</style>
<rect x="1" y="1" width="708" height="999" rx="8" fill="#141414" stroke="#af5fff" stroke-width="2"/>
<text x="18" y="30" xml:space="preserve"> Converting a plug usually takes under 10 minutes. Some stages take a</text>
<text x="18" y="49" xml:space="preserve"> minute or two with little to see - that's normal. Keep the plug plugged</text>
<text x="18" y="68" xml:space="preserve"> in, and this computer awake, until the last stage says complete.</text>
<text x="18" y="106" xml:space="preserve"> <tspan fill="#4e9a06">Stage  1 of 16</tspan> - Confirming prerequisites    - <tspan fill="#4e9a06">Complete</tspan> (0s)</text>
<text x="18" y="125" xml:space="preserve"> <tspan fill="#4e9a06">Stage  2 of 16</tspan> - Validating local files      - <tspan fill="#4e9a06">Complete</tspan> (4s)</text>
<text x="18" y="144" xml:space="preserve"> <tspan fill="#4e9a06">Stage  3 of 16</tspan> - Discovering the plug        - <tspan fill="#4e9a06">Complete</tspan> (7s)</text>
<text x="18" y="163" xml:space="preserve"> <tspan fill="#4e9a06">Stage  4 of 16</tspan> - Querying Sonoff firmware    - <tspan fill="#4e9a06">Complete</tspan> (9s)</text>
<text x="18" y="182" xml:space="preserve"> <tspan fill="#4e9a06">Stage  5 of 16</tspan> - Sending bridge firmware     - <tspan fill="#4e9a06">Complete</tspan> (20s)</text>
<text x="18" y="201" xml:space="preserve"> <tspan fill="#4e9a06">Stage  6 of 16</tspan> - Backing up Sonoff firmware  - <tspan fill="#4e9a06">Complete</tspan> (14s)</text>
<text x="18" y="220" xml:space="preserve"> <tspan fill="#4e9a06">Stage  7 of 16</tspan> - Installing interim firmware - <tspan fill="#4e9a06">Complete</tspan> (19s)</text>
<text x="18" y="239" xml:space="preserve"> <tspan fill="#4e9a06">Stage  8 of 16</tspan> - Preparing memory layout     - <tspan fill="#4e9a06">Complete</tspan> (32s)</text>
<text x="18" y="258" xml:space="preserve"> <tspan fill="#4e9a06">Stage  9 of 16</tspan> - Updating the bootloader     - <tspan fill="#4e9a06">Complete</tspan> (3s)</text>
<text x="18" y="277" xml:space="preserve"> <tspan fill="#4e9a06">Stage 10 of 16</tspan> - Verifying memory layout     - <tspan fill="#4e9a06">Complete</tspan> (2s)</text>
<text x="18" y="296" xml:space="preserve"> <tspan fill="#4e9a06">Stage 11 of 16</tspan> - Staging startup firmware    - <tspan fill="#4e9a06">Complete</tspan> (29s)</text>
<text x="18" y="315" xml:space="preserve"> <tspan fill="#4e9a06">Stage 12 of 16</tspan> - Committing memory layout    - <tspan fill="#4e9a06">Complete</tspan> (5s)</text>
<text x="18" y="334" xml:space="preserve"> <tspan fill="#4e9a06">Stage 13 of 16</tspan> - Installing Tasmota          - <tspan fill="#4e9a06">Complete</tspan> (35s)</text>
<text x="18" y="353" xml:space="preserve"> <tspan fill="#4e9a06">Stage 14 of 16</tspan> - Configuring Tasmota         - <tspan fill="#4e9a06">Complete</tspan> (31s)</text>
<text x="18" y="372" xml:space="preserve"> <tspan fill="#4e9a06">Stage 15 of 16</tspan> - Installing Safeboot         - <tspan fill="#4e9a06">Complete</tspan> (33s)</text>
<text x="18" y="391" xml:space="preserve"> <tspan fill="#4e9a06">Stage 16 of 16</tspan> - Verifying conversion        - <tspan fill="#4e9a06">Complete</tspan> (3s)</text>
<text x="18" y="429" xml:space="preserve"> <tspan fill="#4e9a06">Conversion complete!</tspan></text>
<text x="18" y="448" xml:space="preserve"> The plug is running official Tasmota...</text>
<text x="18" y="467" xml:space="preserve">     <tspan fill="#af5fff" class="b">Your plug:</tspan> http://192.168.1.50/</text>
<text x="18" y="505" xml:space="preserve"> <tspan fill="#4e9a06">Please share how it went!</tspan></text>
<text x="18" y="524" xml:space="preserve"> Copy your results below and post them in the thread...</text>
<text x="18" y="543" xml:space="preserve">     <tspan fill="#af5fff" class="b">Test reports:</tspan> https://github.com/adamsthws/Sonoff-OTA/discussions/1</text>
<text x="18" y="581" xml:space="preserve">     Result:               Converted</text>
<text x="18" y="600" xml:space="preserve">     Firmware:             Tasmota</text>
<text x="18" y="619" xml:space="preserve">     Converted from:       Sonoff</text>
<text x="18" y="638" xml:space="preserve">     Tool version:         2.0.0</text>
<text x="18" y="657" xml:space="preserve">     Plug model:           S60TPG</text>
<text x="18" y="676" xml:space="preserve">     Plug type / region:   UK (Type G)</text>
<text x="18" y="695" xml:space="preserve">     Stock firmware:       1.2.0</text>
<text x="18" y="714" xml:space="preserve">     Sonoff backup:        Completed</text>
<text x="18" y="733" xml:space="preserve">     Computer:             Ubuntu 24.04.5 LTS</text>
<text x="18" y="752" xml:space="preserve">     Python:               3.12.3 (in a virtual environment)</text>
<text x="18" y="771" xml:space="preserve">     Time taken:           4m 15s</text>
<text x="18" y="790" xml:space="preserve">     Stage times:          1=0s, 2=4s, 3=7s, 4=9s, 5=20s, 6=14s, 7=19s, 8=32s,</text>
<text x="18" y="809" xml:space="preserve">                           9=3s, 10=2s, 11=29s, 12=5s, 13=35s, 14=31s, 15=33s,</text>
<text x="18" y="828" xml:space="preserve">                           16=3s</text>
<text x="18" y="847" xml:space="preserve">     Plug busy:            9=1s, 10=1s, 11=28s, 12=4s, 15=30s</text>
<text x="18" y="866" xml:space="preserve">     Retries:              None</text>
<text x="18" y="885" xml:space="preserve">     Plug Wi-Fi signal:    -52 dBm</text>
<text x="18" y="904" xml:space="preserve">     Typed the Wi-Fi:      No</text>
<text x="18" y="923" xml:space="preserve">     Joined setup network: No</text>
<text x="18" y="942" xml:space="preserve">     Name in Tasmota:      Sonoff S60TPG</text>
<text x="18" y="961" xml:space="preserve">     Relay:                Switches (meter confirms)</text>
<text x="18" y="980" xml:space="preserve">     Power meter:          On: 238 V, 0 W; off: 0 V, 0 W</text>
</svg>
