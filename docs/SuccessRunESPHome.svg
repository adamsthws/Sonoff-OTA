<svg xmlns="http://www.w3.org/2000/svg" width="710" height="393" viewBox="0 0 710 393" role="img" aria-labelledby="title">
<title id="title">A successful conversion to ESPHome: all 11 stages complete</title>
<style>:root{--pp:#7c3aed}@media(prefers-color-scheme:dark){:root{--pp:#af5fff}}.ps{stroke:var(--pp)}.pf{fill:var(--pp)}text{font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;fill:#1f2328;white-space:pre}.b{font-weight:bold}@media(prefers-color-scheme:dark){text{fill:#ffffff}}</style>
<rect x="1" y="1" width="708" height="391" rx="8" fill="none" class="ps" stroke-width="1"/>
<text x="18" y="30" xml:space="preserve"> Converting a plug usually takes under 10 minutes. Some stages take a</text>
<text x="18" y="49" xml:space="preserve"> minute or two with little to see - that's normal. Keep the plug plugged</text>
<text x="18" y="68" xml:space="preserve"> in, and this computer awake, until the last stage says complete.</text>
<text x="18" y="106" xml:space="preserve"> <tspan fill="#4e9a06">Stage  1 of 11</tspan> - Confirming prerequisites    - <tspan fill="#4e9a06">Complete</tspan> (0s)</text>
<text x="18" y="125" xml:space="preserve"> <tspan fill="#4e9a06">Stage  2 of 11</tspan> - Validating local files      - <tspan fill="#4e9a06">Complete</tspan> (4s)</text>
<text x="18" y="144" xml:space="preserve"> <tspan fill="#4e9a06">Stage  3 of 11</tspan> - Discovering the plug        - <tspan fill="#4e9a06">Complete</tspan> (7s)</text>
<text x="18" y="163" xml:space="preserve"> <tspan fill="#4e9a06">Stage  4 of 11</tspan> - Querying Sonoff firmware    - <tspan fill="#4e9a06">Complete</tspan> (9s)</text>
<text x="18" y="182" xml:space="preserve"> <tspan fill="#4e9a06">Stage  5 of 11</tspan> - Sending bridge firmware     - <tspan fill="#4e9a06">Complete</tspan> (20s)</text>
<text x="18" y="201" xml:space="preserve"> <tspan fill="#4e9a06">Stage  6 of 11</tspan> - Backing up Sonoff firmware  - <tspan fill="#4e9a06">Complete</tspan> (14s)</text>
<text x="18" y="220" xml:space="preserve"> <tspan fill="#4e9a06">Stage  7 of 11</tspan> - Installing interim firmware - <tspan fill="#4e9a06">Complete</tspan> (19s)</text>
<text x="18" y="239" xml:space="preserve"> <tspan fill="#4e9a06">Stage  8 of 11</tspan> - Making room for ESPHome     - <tspan fill="#4e9a06">Complete</tspan> (33s)</text>
<text x="18" y="258" xml:space="preserve"> <tspan fill="#4e9a06">Stage  9 of 11</tspan> - Updating the bootloader     - <tspan fill="#4e9a06">Complete</tspan> (3s)</text>
<text x="18" y="277" xml:space="preserve"> <tspan fill="#4e9a06">Stage 10 of 11</tspan> - Installing ESPHome          - <tspan fill="#4e9a06">Complete</tspan> (38s)</text>
<text x="18" y="296" xml:space="preserve"> <tspan fill="#4e9a06">Stage 11 of 11</tspan> - Checking ESPHome            - <tspan fill="#4e9a06">Complete</tspan> (12s)</text>
<text x="18" y="334" xml:space="preserve"> <tspan fill="#4e9a06">Conversion complete!</tspan></text>
<text x="18" y="353" xml:space="preserve"> The plug is running ESPHome...</text>
<text x="18" y="372" xml:space="preserve">     <tspan class="b pf">Your plug:</tspan> http://192.168.1.50/</text>
</svg>
