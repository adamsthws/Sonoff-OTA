[platformio]
default_envs = autoflash-bridge
src_dir = main

[env:autoflash-bridge]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Werror=return-type

; Research build: adds a read-only GET /nvs that streams the stock NVS
; partition. Never shipped as the conversion bridge.
[env:autoflash-bridge-nvs-probe]
extends = env:autoflash-bridge
build_flags =
    ${env:autoflash-bridge.build_flags}
    -DBRIDGE_NVS_READOUT

; Research build: adds read-only GET /flash (the whole chip) and GET /efuse,
; and leaves out /update and /tasmota-settings, so it can image a stock plug
; and then return it to stock on a power cycle. Never shipped.
[env:autoflash-bridge-flash-readout]
extends = env:autoflash-bridge
build_flags =
    ${env:autoflash-bridge.build_flags}
    -DBRIDGE_FLASH_READOUT
